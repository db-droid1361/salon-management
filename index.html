var SUPABASE_URL = '';
var SUPABASE_ANON_KEY = '';
var SB_CONFIG_KEY = 'hall_ops_supabase_config';
var SB_DATA_TABLE = 'salon_data';
var SB_DATA_ROW_ID = 1;
var supabaseClient = null;
var cloudSyncReady = false;
var lastSyncAt = null;
var pendingSync = null;
var cloudDirty = false;
var syncQueue = Promise.resolve();
var isPushing = false;
var syncIntervalId = null;

/* --- Configuration --- */
function loadSupabaseConfig() {
try {
var raw = lsGet(SB_CONFIG_KEY);
if (raw) {
var cfg = JSON.parse(raw);
SUPABASE_URL = cfg.url || '';
SUPABASE_ANON_KEY = cfg.key || '';
}
} catch (e) {}
/* Also check environment variables (for GitHub Pages CI) */
if (!SUPABASE_URL && typeof window.SB_ENV_URL !== 'undefined') {
SUPABASE_URL = window.SB_ENV_URL;
}
if (!SUPABASE_ANON_KEY && typeof window.SB_ENV_KEY !== 'undefined') {
SUPABASE_ANON_KEY = window.SB_ENV_KEY;
}
}

function saveSupabaseConfig(url, key) {
try {
lsSet(SB_CONFIG_KEY, JSON.stringify({ url: url, key: key }));
SUPABASE_URL = url;
SUPABASE_ANON_KEY = key;
return true;
} catch (e) { return false; }
}

function clearSupabaseConfig() {
try { localStorage.removeItem(SB_CONFIG_KEY); } catch (e) {}
SUPABASE_URL = '';
SUPABASE_ANON_KEY = '';
}

function isSupabaseConfigured() {
return !!(SUPABASE_URL && SUPABASE_ANON_KEY && 
!SUPABASE_URL.includes('YOUR_') && !SUPABASE_ANON_KEY.includes('YOUR_') &&
SUPABASE_URL.startsWith('http'));
}

function initSupabaseClient() {
if (!isSupabaseConfigured()) {
setSyncStatus('offline', 'محلی');
return false;
}
// FIX 15: Singleton - don't create multiple clients
if (supabaseClient) {
console.log('[Supabase] Client already exists');
return true;
}
try {
if (typeof window.supabase === 'undefined') {
console.warn('[Supabase] SDK not loaded');
setSyncStatus('offline', 'محلی');
return false;
}
supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
console.log('[Supabase] Client initialized');
setSyncStatus('syncing', 'در حال اتصال...');
return true;
} catch (e) {
console.error('[Supabase] Init error:', e);
setSyncStatus('error', 'خطا');
return false;
}
}

function setSyncStatus(state, text) {
var el = document.getElementById('syncIndicator');
var txt = document.getElementById('syncText');
if (!el || !txt) return;
el.className = 'sync-indicator ' + state;
txt.textContent = text;
}

/* --- Cloud Sync --- */
async function syncToCloud() {
if (!cloudSyncReady || !supabaseClient) return false;
if (isPushing) return false;
isPushing = true;
setSyncStatus('syncing', 'در حال ذخیره...');
try {
if (!db._meta) db._meta = {};
db._meta.savedAt = new Date().toISOString();
db._meta.appVersion = APP_VERSION;

// FIX 3: Optimistic Locking - check if cloud is newer
var oldUpdatedAt = lastSyncAt ? lastSyncAt.toISOString() : null;
var query = supabaseClient.from(SB_DATA_TABLE);
var checkResult = await query.select('updated_at').eq('id', SB_DATA_ROW_ID).maybeSingle();

if (checkResult.data && checkResult.data.updated_at && oldUpdatedAt) {
var cloudTime = new Date(checkResult.data.updated_at).getTime();
var localTime = lastSyncAt.getTime();
if (cloudTime > localTime) {
console.warn('[Supabase] Cloud is newer! Merging needed.');
// FIX: Don't overwrite - pull first, then push
isPushing = false;
var mergeResult = await syncFromCloud();
if (mergeResult === 'loaded') {
// After merge, retry push
return await syncToCloud();
}
return false;
}
}

// FIX 4: Don't send updated_at - let DB trigger set it
const { error } = await supabaseClient
.from(SB_DATA_TABLE)
.upsert({
id: SB_DATA_ROW_ID,
json_data: db
});

if (error) {
console.error('[Supabase] Upload error:', error.message);
setSyncStatus('error', 'خطای سینک');
isPushing = false;
return false;
}

// Get the actual updated_at from server
const { data: updated } = await supabaseClient
.from(SB_DATA_TABLE)
.select('updated_at')
.eq('id', SB_DATA_ROW_ID)
.maybeSingle();

if (updated && updated.updated_at) {
lastSyncAt = new Date(updated.updated_at);
}
cloudDirty = false;
setSyncStatus('online', 'آنلاین');
isPushing = false;
return true;
} catch (e) {
console.error('[Supabase] Upload exception:', e);
setSyncStatus('error', 'خطای شبکه');
isPushing = false;
return false;
}
}

function scheduleSyncToCloud() {
if (!cloudSyncReady) return;
if (pendingSync) clearTimeout(pendingSync);
pendingSync = setTimeout(function() {
syncToCloud().then(function(ok) {
if (!ok) setSyncStatus('error', 'خطا');
});
}, 1500);
}

var isInitialLoad = true;

async function syncFromCloud() {
if (!supabaseClient) return 'error';
// FIX 9: Don't pull if we have pending changes (push first) - but only if not initial load
if (isInitialLoad) {
console.log('[Supabase] Initial load - always check cloud first');
} else if (cloudDirty && !isPushing) {
console.log('[Supabase] Local changes pending, pushing first...');
await syncToCloud();
return 'pushed';
}
try {
setSyncStatus('syncing', 'در حال بارگذاری...');

const { data, error } = await supabaseClient
.from(SB_DATA_TABLE)
.select('json_data, updated_at')
.eq('id', SB_DATA_ROW_ID)
.maybeSingle();

if (error) {
console.error('[Supabase] Download error:', error.message);
setSyncStatus('error', 'خطا');
isInitialLoad = false;
return 'error';
}

if (data && data.json_data) {
const cloudData = data.json_data;
// FIX 5: Flexible validation - ensure required arrays exist (don't fail if missing)
if (typeof cloudData !== 'object' || cloudData === null) {
console.error('[Supabase] Cloud data is not an object');
setSyncStatus('error', 'داده نامعتبر');
isInitialLoad = false;
return 'error';
}
// Auto-fix missing arrays
if (!Array.isArray(cloudData.reservations)) cloudData.reservations = [];
if (!Array.isArray(cloudData.halls)) cloudData.halls = [];
if (!Array.isArray(cloudData.equipment)) cloudData.equipment = [];
if (!Array.isArray(cloudData.slots)) cloudData.slots = [];
if (!Array.isArray(cloudData.applicants)) cloudData.applicants = [];
if (!Array.isArray(cloudData.users)) cloudData.users = [];
if (!Array.isArray(cloudData.logs)) cloudData.logs = [];
if (!cloudData._meta) cloudData._meta = { appVersion: APP_VERSION, savedAt: null };

const cloudTime = new Date(data.updated_at).getTime();
const localTime = db._meta && db._meta.savedAt ? new Date(db._meta.savedAt).getTime() : 0;

// On initial load, if cloud has ANY data (even with users), always load it
if (isInitialLoad) {
console.log('[Supabase] Initial load - loading from cloud (cloudTime:', cloudTime, 'localTime:', localTime, ')');
// Check if cloud has users (don't overwrite if cloud is empty of users but local has them)
var cloudHasUsers = Array.isArray(cloudData.users) && cloudData.users.length > 0;
var localHasUsers = Array.isArray(db.users) && db.users.length > 0;
var localHasReservations = Array.isArray(db.reservations) && db.reservations.length > 0;

if (cloudHasUsers || (!localHasUsers && !localHasReservations)) {
// Cloud has users OR local is empty - load from cloud
try {
localStorage.setItem(KEY + '_backup', JSON.stringify(db));
} catch (e) {}

db = cloudData;
migrateData();
markPastForReview();
try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {}
console.log('[Supabase] Data loaded from cloud on initial load');
lastSyncAt = new Date(data.updated_at);
cloudDirty = false;
setSyncStatus('online', 'آنلاین');
isInitialLoad = false;
return 'loaded';
} else {
// Local has users but cloud doesn't - push local to cloud
console.log('[Supabase] Local has users, cloud does not - pushing local');
cloudSyncReady = true;
isInitialLoad = false;
await syncToCloud();
return 'pushed';
}
} else if (cloudTime > localTime) {
// Cloud is newer - backup local data first
try {
localStorage.setItem(KEY + '_backup', JSON.stringify(db));
} catch (e) {}

db = cloudData;
migrateData();
markPastForReview();
try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {}
console.log('[Supabase] Data loaded from cloud');
lastSyncAt = new Date(data.updated_at);
cloudDirty = false;
setSyncStatus('online', 'آنلاین');
return 'loaded';
} else {
// Local is newer or equal - push to cloud
cloudSyncReady = true;
await syncToCloud();
return 'pushed';
}
} else {
// No data in cloud yet
console.log('[Supabase] No data in cloud');
// FIX: Don't blindly push if local has real data (avoid overwriting)
if (db._meta && db._meta.savedAt && (db.users.length > 0 || db.reservations.length > 0)) {
console.warn('[Supabase] Cloud empty but local has data — refusing to push blindly');
isInitialLoad = false;
return 'empty';
}
cloudSyncReady = true;
isInitialLoad = false;
await syncToCloud();
return 'pushed';
}
} catch (e) {
console.error('[Supabase] Download exception:', e);
setSyncStatus('error', 'خطا');
isInitialLoad = false;
return 'error';
}
}

urn;    var y=this.current.y,m=this.current.m;var g=jalaali.toGregorian(y,m,1);    var off=(new Date(g.gy,g.gm-1,g.gd).getDay()+1)%7;var dim=jalaali.jalaaliMonthLength(y,m);var t=today();    var yOpts='';for(var i=1404;i<=1414;i++)yOpts+='<option value="'+i+'" '+(i===y?'selected':'')+'>'+faNum(i)+'</option>';    var mOpts=persianMonths.map(function(n,i){return '<option value="'+(i+1)+'" '+(i+1===m?'selected':'')+'>'+n+'</option>'}).join('');    var html='<div style="display:flex;gap:6px;margin-bottom:12px"><button class="secondary small" onclick="pDate.changeMonth(-1)">◀</button><select onchange="pDate.setM(this.value)" style="flex:1">'+mOpts+'</select><select onchange="pDate.setY(this.value)" style="flex:1">'+yOpts+'</select><button class="secondary small" onclick="pDate.changeMonth(1)">▶</button></div><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center">';    ['ش','ی','د','س','چ','پ','ج'].forEach(function(d){html+='<div style="font-size:11px;color:var(--text2);padding:4px;font-weight:700">'+d+'</div>'});    for(var i=0;i<off;i++)html+='<div></div>';    for(var d=1;d<=dim;d++){      var iso=y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');      var gd=jalaali.toGregorian(y,m,d);var dow=new Date(gd.gy,gd.gm-1,gd.gd).getDay();      var st='padding:8px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600;';      if(dow===5)st+='color:var(--danger);';      if(iso===t)st+='border:1px solid var(--primary);color:var(--primary);background:var(--primaryS);';      if(this.target&&iso===this.target.value)st+='background:var(--primary);color:#fff;';      var past=this.noPast&&iso<t;if(past)st+='color:#cbd5e1;cursor:not-allowed;background:var(--surface3);';      html+='<div style="'+st+'" '+(past?'':'onclick="pDate.select(\''+iso+'\')"')+'>'+faNum(d)+'</div>';    }    html+='</div><div style="display:flex;justify-content:space-between;margin-top:16px;padding-top:12px;border-top:1px solid var(--border)"><button class="secondary small" onclick="pDate.goToday()">📌 امروز</button><button class="secondary small" onclick="pDate.close()">بستن</button></div>';    el.innerHTML=html;  }};/* ============ Keyboard ============ */document.addEventListener('keydown',function(e){
